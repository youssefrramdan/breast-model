<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breast Cancer Classification</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        min-height: 100vh;
      }
      .main-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      }
      .upload-area {
        border: 2px dashed #dee2e6;
        border-radius: 10px;
        padding: 2rem;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .upload-area:hover {
        border-color: #0d6efd;
        background-color: #f8f9fa;
      }
      .preview-image {
        max-width: 100%;
        max-height: 300px;
        margin: 1rem 0;
        border-radius: 5px;
      }
      .result-card {
        margin-top: 2rem;
        display: none;
      }
      .progress-bar {
        transition: width 0.3s ease;
      }
      .loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container main-container">
      <h1 class="text-center mb-4">Breast Cancer Classification</h1>

      <div class="upload-area" id="uploadArea">
        <div class="mb-3">
          <i class="fas fa-cloud-upload-alt fa-3x text-muted"></i>
          <h4 class="mt-3">Drop your image here or click to upload</h4>
          <p class="text-muted">Supported formats: JPG, JPEG, PNG</p>
        </div>
        <input type="file" id="fileInput" accept="image/*" class="d-none" />
      </div>

      <div class="text-center mt-3">
        <img id="previewImage" class="preview-image" style="display: none" />
      </div>

      <div class="loading text-center mt-4">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Processing image...</p>
      </div>

      <div class="result-card" id="resultCard">
        <h3 class="text-center mb-4">Prediction Results</h3>
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">
              Predicted Class:
              <span id="predictedClass" class="text-primary"></span>
            </h5>
            <p class="card-text">Confidence: <span id="confidence"></span>%</p>

            <h6 class="mt-4 mb-3">Class Probabilities:</h6>
            <div id="probabilitiesContainer"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js"></script>
    <script>
      const uploadArea = document.getElementById("uploadArea");
      const fileInput = document.getElementById("fileInput");
      const previewImage = document.getElementById("previewImage");
      const resultCard = document.getElementById("resultCard");
      const loading = document.querySelector(".loading");

      uploadArea.addEventListener("click", () => fileInput.click());
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = "#0d6efd";
        uploadArea.style.backgroundColor = "#f8f9fa";
      });
      uploadArea.addEventListener("dragleave", (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = "#dee2e6";
        uploadArea.style.backgroundColor = "white";
      });
      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = "#dee2e6";
        uploadArea.style.backgroundColor = "white";
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
      });

      fileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) handleFile(file);
      });

      function handleFile(file) {
        if (!file.type.startsWith("image/")) {
          alert("Please upload an image file");
          return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
          previewImage.src = e.target.result;
          previewImage.style.display = "block";
          uploadImage(file);
        };
        reader.readAsDataURL(file);
      }

      function uploadImage(file) {
        const formData = new FormData();
        formData.append("file", file);

        resultCard.style.display = "none";
        loading.style.display = "block";

        fetch("/predict", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            loading.style.display = "none";
            displayResults(data);
          })
          .catch((error) => {
            loading.style.display = "none";
            alert("Error processing image: " + error.message);
          });
      }

      function displayResults(data) {
        document.getElementById("predictedClass").textContent = data.class;
        document.getElementById("confidence").textContent = (
          data.confidence * 100
        ).toFixed(2);

        const probabilitiesContainer = document.getElementById(
          "probabilitiesContainer"
        );
        probabilitiesContainer.innerHTML = "";

        Object.entries(data.probabilities).forEach(
          ([className, probability]) => {
            const percentage = (probability * 100).toFixed(2);
            const progressBar = `
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span>${className}</span>
                            <span>${percentage}%</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" role="progressbar"
                                 style="width: ${percentage}%"
                                 aria-valuenow="${percentage}"
                                 aria-valuemin="0"
                                 aria-valuemax="100">
                            </div>
                        </div>
                    </div>
                `;
            probabilitiesContainer.innerHTML += progressBar;
          }
        );

        resultCard.style.display = "block";
      }
    </script>
  </body>
</html>
